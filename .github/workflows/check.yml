name: Check programs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: make -j2 all test
      - name: Check translated auxiliary structures with sanitizers
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Icpp -x c++ tests/structures.c cpp/queue.cpp cpp/stack.cpp cpp/priority_queue.cpp cpp/set_union.cpp cpp/graph.cpp -o build/tests/structures-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./build/tests/structures-sanitized
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -x c++ tests/tsp_values.c cpp/tsp-pq.cpp -o build/tests/tsp-values-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ./build/tests/tsp-values-sanitized
