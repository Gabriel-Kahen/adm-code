name: Build and correctness regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select preinstalled compiler tools
        run: |
          command -v gcc
          command -v make
          command -v python3
          clang_bin="$(command -v clang-18 || command -v clang)"
          test -n "$clang_bin"
          mkdir -p "$RUNNER_TEMP/adm-tools"
          ln -s "$clang_bin" "$RUNNER_TEMP/adm-tools/clang"
          echo "$RUNNER_TEMP/adm-tools" >> "$GITHUB_PATH"
          "$clang_bin" --version
      - name: Build current sources
        run: make -B -j2 all CC=${{ matrix.cc }}
      - name: Run corrected regression suite
        run: make test-c CC=${{ matrix.cc }}

  languages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Check C++, Java, and Python against independent oracles
        run: make test-ports

  readability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned maintenance tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting, Python lint, and generated excerpts
        run: make check-format check-fragments
